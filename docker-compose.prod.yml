version: '3.8'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.prod
    container_name: upi_rakshak_backend_prod
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=sqlite:///./data/upi_rakshak.db
      - JWT_SECRET=${JWT_SECRET:-upi_rakshak_prod_secret_key_change_in_env}
      - ADMIN_EMAIL=${ADMIN_EMAIL:-admin@upirakshak.ai}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD:-}
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN:-}
      - TWILIO_ACCOUNT_SID=${TWILIO_ACCOUNT_SID:-}
      - TWILIO_AUTH_TOKEN=${TWILIO_AUTH_TOKEN:-}
      - WHATSAPP_API_TOKEN=${WHATSAPP_API_TOKEN:-}
      - LOG_LEVEL=INFO
    volumes:
      - backend_data:/app/data
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 1536M
        reservations:
          cpus: '0.5'
          memory: 512M
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - rakshak_net

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: upi_rakshak_frontend_prod
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      backend:
        condition: service_healthy
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512M
        reservations:
          cpus: '0.2'
          memory: 128M
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 5s
    networks:
      - rakshak_net

volumes:
  backend_data:
    driver: local

networks:
  rakshak_net:
    driver: bridge
