version: '3.8'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: upi_rakshak_backend
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=sqlite:///./data/upi_rakshak.db
      - JWT_SECRET=${JWT_SECRET:-upi_rakshak_demo_jwt_secret_key_2026_super_safe}
      - ADMIN_EMAIL=${ADMIN_EMAIL:-admin@upirakshak.ai}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD:-}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health')"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: upi_rakshak_frontend
    ports:
      - "3000:80"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
