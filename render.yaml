services:
  - type: web
    name: upi-rakshak-ai
    runtime: python
    buildCommand: "./build.sh"
    startCommand: "uvicorn backend.app.main:app --host 0.0.0.0 --port $PORT"
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.4
      - key: NODE_VERSION
        value: 20.18.0
      - key: DATABASE_URL
        value: sqlite:///./backend/data/upi_rakshak.db
      - key: JWT_SECRET
        generateValue: true
      - key: ADMIN_EMAIL
        value: admin@upirakshak.ai
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: SENDER_HASH_SALT
        generateValue: true
